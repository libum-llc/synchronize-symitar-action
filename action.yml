name: 'Synchronize Symitar'
description: 'GitHub Action to synchronize a directory on the Jack Henry™ credit union core platform'
author: 'libum-llc'

branding:
  icon: 'refresh-cw'
  color: 'blue'

inputs:
  directory-type:
    description: 'The type of Symitar directory to synchronize (powerOns, letterFiles, dataFiles, helpFiles)'
    required: true
  local-directory-path:
    description: 'The local directory path containing files to synchronize. If not specified, defaults to the standard path for the selected directory type (e.g., REPWRITERSPECS/ for PowerOns)'
    required: false
  connection-type:
    description: 'The connection method to use (https or ssh). HTTPS is faster.'
    required: false
    default: 'ssh'
  sync-mode:
    description: 'Synchronization mode: push (upload only), pull (download only), or mirror (exact sync - deletes extra files on Symitar)'
    required: true
  dry-run:
    description: 'If true, shows proposed changes without applying them'
    required: false
    default: 'true'
  symitar-hostname:
    description: 'The Symitar server hostname or IP address'
    required: true
  symitar-app-port:
    description: 'The SymAppServer port (typically 42 + symNumber, e.g., 42627). Required when connection-type is https.'
    required: false
  ssh-username:
    description: 'The AIX SSH username for the Symitar host'
    required: true
  ssh-password:
    description: 'The AIX SSH password for the Symitar host'
    required: true
  ssh-port:
    description: 'The SSH port for the Symitar server (only used when connection-type is ssh)'
    required: false
    default: '22'
  sym-number:
    description: 'The Symitar SYM number (e.g., 627)'
    required: true
  symitar-user-number:
    description: 'The Symitar Quest user number'
    required: true
  symitar-user-password:
    description: 'The Symitar Quest user password'
    required: true
  api-key:
    description: 'The PowerOn Pipelines API Key from the Libum Portal'
    required: true
  install-poweron-list:
    description: 'List of PowerOn files to install after sync. Accepts a comma-delimited string or a YAML list (one item per line, optionally `- ` prefixed). Only applies to powerOns directory type.'
    required: false
    default: ''
  validate-ignore-list:
    description: 'List of PowerOn files to skip validation for. Accepts a comma-delimited string or a YAML list (one item per line, optionally `- ` prefixed).'
    required: false
    default: ''
  preserve-server-files:
    description: 'List of exact filenames or glob patterns where the server copy should be preserved during push/mirror. Accepts a comma-delimited string or a YAML list (one item per line, optionally `- ` prefixed). Use with pull-preserved-only to pull only these files.'
    required: false
    default: ''
  pull-preserved-only:
    description: 'When sync-mode is pull, only pull files matched by preserve-server-files. If no preserve-server-files are configured, this is a no-op.'
    required: false
    default: 'false'
  commit-pulled-changes:
    description: 'When sync-mode is pull, commit and push pulled workspace changes after synchronization. Never commits during dry-run.'
    required: false
    default: 'false'
  commit-message:
    description: 'Commit message used when commit-pulled-changes is enabled'
    required: false
    default: 'chore: sync server-managed Symitar files [skip ci]'
  commit-branch:
    description: 'Branch to push the commit to. Defaults to the checked-out branch.'
    required: false
    default: ''
  git-user-name:
    description: 'Git author name used when commit-pulled-changes is enabled'
    required: false
    default: 'libum-bot'
  git-user-email:
    description: 'Git author email used when commit-pulled-changes is enabled'
    required: false
    default: 'bot@libum.io'
  create-pull-request:
    description: 'When sync-mode is pull, commit the pulled changes to pull-request-branch, push it, and open (or reuse) a pull request into pull-request-target-branch instead of pushing to commit-branch. Requires github-token. Mutually exclusive with commit-pulled-changes. Never opens a pull request during dry-run.'
    required: false
    default: 'false'
  pull-request-branch:
    description: 'Head branch the pulled changes are committed to when create-pull-request is enabled. Force-pushed with --force-with-lease. Must differ from pull-request-target-branch.'
    required: false
    default: 'chore/symitar-pull'
  pull-request-target-branch:
    description: 'Base branch the pull request targets when create-pull-request is enabled. Defaults to commit-branch, which itself defaults to the checked-out branch.'
    required: false
    default: ''
  pull-request-title:
    description: 'Title of the pull request opened when create-pull-request is enabled'
    required: false
    default: 'chore: sync server-managed Symitar files'
  pull-request-body:
    description: 'Body of the pull request opened when create-pull-request is enabled'
    required: false
    default: 'Auto-generated pull of server-managed Symitar files.'
  github-token:
    description: 'Token used to open the pull request when create-pull-request is enabled. Needs `pull-requests: write` - the default GITHUB_TOKEN only has it when the job grants that permission. Required whenever create-pull-request is true; the run fails before contacting Symitar if it is missing.'
    required: false
    default: ''
  sync-method:
    description: 'The transport method for file synchronization: sftp (default) or rsync'
    required: false
    default: 'sftp'
  sftp-concurrency:
    description: 'Number of concurrent SFTP transfers (only applies when sync-method is sftp)'
    required: false
    default: '4'
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'

outputs:
  files-deployed:
    description: 'Number of files deployed (added/updated)'
  files-deleted:
    description: 'Number of files deleted'
  files-installed:
    description: 'Number of PowerOn files installed (only for powerOns directory type)'
  files-uninstalled:
    description: 'Number of PowerOn files uninstalled (only for powerOns directory type)'
  outliers-count:
    description: 'Number of server files that differ from local but are NOT preserve-matched (server-side drift detection). Only populated when sync-mode is pull and pull-preserved-only is true.'
  outlier-files:
    description: 'JSON array of outlier file names'
  pull-request-id:
    description: 'Number of the pull request opened or reused by create-pull-request. Only published when a pull request was actually opened or reused - not on dry runs, and not when the pull produced no changes to commit.'
  pull-request-url:
    description: 'Web URL of the pull request opened or reused by create-pull-request. Published under the same conditions as pull-request-id.'

runs:
  # node24: GitHub has deprecated node20 for actions and already executes
  # node20 actions on Node 24, so declaring it explicitly removes the
  # deprecation warning and matches the Node that CI builds dist/ with.
  using: 'node24'
  main: 'dist/index.js'
